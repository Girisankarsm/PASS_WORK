name: Windows x64 Build, Test & Release

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build & Test on Windows x64 (MSVC 2022)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Frontend Dependencies & Build Bundle
        run: |
          cd frontend
          npm ci
          npx tsc --noEmit
          npm run build
          cd ..

      - name: Run Scientific Classification Test Suite
        run: |
          node scripts/test_geometry_classification.mjs

      - name: Configure CMake (Visual Studio 2022 x64 Release)
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ Binaries (Server, Tests, Launcher)
        run: |
          cmake --build build --config Release --parallel

      - name: Run C++ Automated Verification Test Suite (CTest)
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Assemble Windows Standalone Release Package
        run: |
          copy build\Release\workbench_server.exe .
          copy build\Release\Launch.exe .
          python scripts\package_windows.py
          python scripts\package_submission.py

      - name: Smoke Test Launch.exe & Health Endpoint on Windows
        shell: powershell
        run: |
          Write-Host "Starting Launch.exe in headless mode for automated smoke test..."
          $proc = Start-Process -FilePath "Launch.exe" -ArgumentList "--no-browser" -WorkingDirectory "." -PassThru
          Start-Sleep -Seconds 4

          try {
            $health = Invoke-RestMethod -Uri "http://localhost:8080/api/health" -TimeoutSec 5
            Write-Host "Health Check Response:" ($health | ConvertTo-Json)
            if ($health.success -ne $true) {
              throw "Health check did not return success: true"
            }
            Write-Host "SUCCESS: Launch.exe spawned backend and served health endpoint successfully!"
          } finally {
            Write-Host "Terminating Launch.exe and backend process tree (PID $($proc.Id))..."
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Get-Process -Name "workbench_server" -ErrorAction SilentlyContinue | Stop-Process -Force
          }

      - name: Upload Windows Submission Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RA2311003012331_Workbench_Release
          path: |
            RA2311003012331_Workbench.zip
            RA2311003012331_Workbench.zip.sha256
            PassScience_Workbench_windows_x64.zip
            release/
          retention-days: 30


name: Windows x64 Build, Test & Release

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build & Test on Windows x64 (MSVC 2022)
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Python UTF-8 Encoding
        shell: powershell
        run: |
          "PYTHONUTF8=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PYTHONIOENCODING=utf-8" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create Git Repository Bundle
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          git bundle create PASS_WORK_repo.bundle --all
          if ($LASTEXITCODE -ne 0) {
            throw "Git bundle creation failed."
          }

          git bundle verify PASS_WORK_repo.bundle
          if ($LASTEXITCODE -ne 0) {
            throw "Git bundle verification failed."
          }

          Write-Host "Git repository bundle created successfully."

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Visual Studio and C++ Toolchain
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          cmake --version
          if ($LASTEXITCODE -ne 0) {
            throw "CMake is unavailable."
          }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (!(Test-Path $vswhere)) {
            throw "vswhere.exe was not found."
          }

          $vsPath = & $vswhere `
            -version "[17.0,18.0)" `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (!$vsPath) {
            throw "Visual Studio 2022 with C++ tools was not found."
          }

          Write-Host "Visual Studio 2022 found at: $vsPath"

      - name: Install Frontend Dependencies & Build Bundle
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Push-Location frontend
          try {
            npm ci
            if ($LASTEXITCODE -ne 0) {
              throw "npm ci failed."
            }

            npx tsc --noEmit
            if ($LASTEXITCODE -ne 0) {
              throw "TypeScript validation failed."
            }

            npm run build
            if ($LASTEXITCODE -ne 0) {
              throw "Frontend build failed."
            }
          }
          finally {
            Pop-Location
          }

      - name: Run Scientific Classification Tests
        shell: powershell
        run: |
          node scripts/test_geometry_classification.mjs
          if ($LASTEXITCODE -ne 0) {
            throw "Scientific classification tests failed."
          }

      - name: Configure CMake
        shell: powershell
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed."
          }

      - name: Build C++ Binaries
        shell: powershell
        run: |
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) {
            throw "C++ compilation failed."
          }

      - name: Run C++ Tests
        shell: powershell
        run: |
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) {
            throw "CTest verification failed."
          }

      - name: Assemble Windows Release Package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $server = "build\Release\workbench_server.exe"
          $launcher = "build\Release\Launch.exe"

          if (!(Test-Path $server)) {
            throw "Missing $server. Check the CMake target output paths."
          }

          if (!(Test-Path $launcher)) {
            throw "Missing $launcher. Check the CMake target output paths."
          }

          Copy-Item $server ".\workbench_server.exe" -Force
          Copy-Item $launcher ".\Launch.exe" -Force

          python scripts/package_windows.py
          if ($LASTEXITCODE -ne 0) {
            throw "Windows packaging script failed."
          }

          if (!(Test-Path "PASS_WORK_repo.bundle")) {
            throw "PASS_WORK_repo.bundle is missing."
          }

          Write-Host "Checking required submission files in the checkout..."
          git status --short

          python scripts/package_submission.py
          if ($LASTEXITCODE -ne 0) {
            throw "Submission packaging script failed."
          }

      - name: Smoke Test Launcher and Health Endpoint
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          if (!(Test-Path ".\Launch.exe")) {
            throw "Launch.exe was not found."
          }

          $proc = Start-Process `
            -FilePath ".\Launch.exe" `
            -ArgumentList "--no-browser" `
            -WorkingDirectory "." `
            -PassThru

          try {
            Start-Sleep -Seconds 4

            if ($proc.HasExited) {
              throw "Launch.exe exited with code $($proc.ExitCode)."
            }

            $health = Invoke-RestMethod `
              -Uri "http://localhost:8080/api/health" `
              -TimeoutSec 10

            $health | ConvertTo-Json -Depth 5

            if ($health.success -ne $true) {
              throw "Health endpoint did not return success: true."
            }

            Write-Host "Launcher and backend health check passed."
          }
          finally {
            if ($proc -and !$proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }

            Get-Process -Name "workbench_server" -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - name: Verify Release Artifacts
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $expectedFiles = @(
            "RA2311003012331_Workbench.zip",
            "RA2311003012331_Workbench.zip.sha256",
            "PassScience_Workbench_windows_x64.zip"
          )

          foreach ($file in $expectedFiles) {
            if (Test-Path $file) {
              Write-Host "Found artifact: $file"
            }
            else {
              Write-Warning "Expected artifact not found: $file"
            }
          }

          Get-ChildItem -Path . -Filter "*.zip" -File -ErrorAction SilentlyContinue |
            Select-Object Name, Length

          $hasReleaseZip = (
            (Test-Path "RA2311003012331_Workbench.zip") -or
            (Test-Path "PassScience_Workbench_windows_x64.zip") -or
            (Test-Path "release")
          )

          if (!$hasReleaseZip) {
            throw "No expected release ZIP or release directory was generated."
          }

      - name: Upload Windows Submission Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RA2311003012331_Workbench_Release
          path: |
            RA2311003012331_Workbench.zip
            RA2311003012331_Workbench.zip.sha256
            PassScience_Workbench_windows_x64.zip
            release/
          if-no-files-found: error
          retention-days: 30
